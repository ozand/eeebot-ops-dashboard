[Service]
ExecStartPre=-+/opt/eeebot-techtree/eeebot-techtree-sync.sh
# Issue #155: run the generator from the repo-mirror layout the sync installs.
# techtree_viewer.py resolves its vendored assets as
# Path(__file__).parent.parent / 'assets' / 'vendor', which only lands inside
# the install root when the generators sit in the scripts/ subdirectory.
ExecStart=
ExecStart=/usr/bin/python3 /opt/eeebot-techtree/scripts/techtree_autopublish.py
