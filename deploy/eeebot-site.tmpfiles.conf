# ADR-036 D1 host snapshot sink (#315, architect decision "variant B"):
# the site root the publisher writes and the DynamicUser server reads.
# Created by systemd-tmpfiles (installed to /etc/tmpfiles.d/eeebot-site.conf
# as a D4 class-3 step, and re-applied at every boot by
# systemd-tmpfiles-setup.service) -- BEFORE the publisher unit sets up its
# namespace, so its ReadWritePaths=/var/lib/eeebot-site always names an
# existing directory. 0755: the server identity must read it; only the
# publisher (owner) writes.
d /var/lib/eeebot-site 0755 eeebot-publish eeebot-publish -
