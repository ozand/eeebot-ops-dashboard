name: Test Suite

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dashboard repository
        uses: actions/checkout@v4
        with:
          # #210: tests/test_techtree_sync_artifacts.py reads the pre-fix sync
          # script from a pinned commit via `git show`; a depth-1 clone would
          # silently skip that control test.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jinja2
          pip install git+https://github.com/ozand/eeebot.git
          pip install -e .

      - name: Run pytest
        run: |
          PYTHONPATH=. pytest -v
