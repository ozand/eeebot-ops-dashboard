[Service]
# Permanent publisher safety budget (issue #341): cold scanner runs after a
# rules/version change have taken 5:45 on the constrained eeepc host, exceeding
# systemd's 5-minute default. Keep 15 minutes to avoid killing valid publishes;
# runtime duration warnings in techtree_autopublish.py provide operational
# visibility without treating slow-but-successful publishes as failures.
TimeoutStartSec=15min
