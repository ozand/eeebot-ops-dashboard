[Unit]
# Fires the tech-tree publisher at the end of every completed bridge
# iteration (issue #27), event-driven off the loop rather than a wall-clock
# timer -- this sidesteps the NTP-drift stagnation trap documented for
# wall-clock timers elsewhere in this project. (This is true of THIS
# trigger only: the staleness floor inside techtree_autopublish.py's
# should_publish() still reads wall-clock time.time(), and a backward clock
# jump there is handled separately -- see the comment on should_publish.)
#
# Sources checked (issue #27 review, blocker B6): the man.archlinux.org
# mirror of systemd.unit(5) and systemd.service(5), rendered for systemd
# 261.2 (freedesktop.org's own copy of these pages 403'd for this fetch;
# the host runs systemd 252, but OnSuccess=/OnSuccessJobMode=/oneshot
# semantics quoted below are long-stable and unchanged across that range).
# Quoting only what those pages actually say -- an earlier version of this
# comment attributed the phrase "out of an active or activating state" to
# OnSuccess=, which is wrong; a later round then "corrected" that into a
# second wrong claim, asserting the phrase appears nowhere in
# systemd.unit(5) at all and forbidding any future correction. Both are
# false. Checked directly against man/systemd.unit.xml in the systemd
# source, issue #27 review round 4:
#   - At the v252 tag (the version this host runs), the phrase is genuinely
#     absent. FailureAction=/SuccessAction= -- a different, unrelated
#     directive this unit does not set -- reads only "Configure the action
#     to take when the unit stops and enters a failed state or inactive
#     state."
#   - On main, the phrase IS present (around line 1119), added to that same
#     FailureAction=/SuccessAction= section: "These actions are tied to the
#     unit's state transitions and fire only when the unit actually
#     transitions out of an active or activating state." It still has
#     nothing to do with OnSuccess=/OnFailure=, which is the directive this
#     drop-in actually uses.
#   - Why round 3's plain-text search missed this on main: the phrase is
#     split by DocBook markup in the source XML (transitions out of an
#     <constant>active</constant> or <constant>activating</constant>
#     state), so a literal-string grep against the raw file gives a false
#     negative even where the rendered text contains the phrase. That
#     false negative is what produced round 3's wrong "does not exist
#     anywhere" claim -- not a real absence on main.
# Do not re-derive "this phrase does not exist in systemd.unit(5)" from a
# plain-text search of the XML source; check the rendered man page or
# account for DocBook tag-splitting first.
#
# systemd.unit(5), verbatim: `OnSuccess=` is "A space-separated list of one
# or more units that are activated when this unit enters the 'inactive'
# state" (`OnFailure=` is the same but for the "failed" state instead).
#
# eeepc-self-evolving-subagent-bridge.service is Type=oneshot with the
# default RemainAfterExit=no. systemd.service(5), verbatim: "if this
# option is used without RemainAfterExit= the service will never enter
# 'active' unit state, but will directly transition from 'activating' to
# 'deactivating' or 'dead' ... after a service of this type ran (and which
# has RemainAfterExit= not set) it will not show up as started afterwards,
# but as dead." "dead" is the substate backing the unit-level "inactive"
# state that OnSuccess= watches for -- so each successful ExecStart exit
# drives exactly the transition OnSuccess= fires on, once per completed
# iteration, not just once ever.
#
# This drop-in lives in THIS repo (eeebot-ops-dashboard), not in
# ozand/eeebot: the dashboard depends on the self-evolving loop, not the
# other way around, so the loop's own unit file should not need to know
# the dashboard exists. Layering the trigger in as a drop-in keeps that
# dependency direction intact.
#
# OnSuccess= starts eeebot-techtree-publish.service as its own,
# independently enqueued job, not a strong dependency like BindsTo=/
# PartOf= that would propagate the child unit's result back to this one --
# so a failure of the publish job cannot fail, block, or restart the
# bridge; the loop keeps running regardless of whether gh-pages publish
# succeeds.
#
# Overlap behaviour (issue #27 review round 3, note N3): `OnSuccessJobMode=`
# defaults to "fail" -- confirmed against src/core/unit.c in the systemd
# source (`u->on_success_job_mode = JOB_FAIL;`), NOT against systemd.unit(5):
# on this host's systemd 252, that man page documents OnFailureJobMode= but
# does not mention OnSuccessJobMode= at all. On main it is documented, as a
# merged OnSuccessJobMode=/OnFailureJobMode= entry; that entry's version-info
# tag reads v209, but v209 is when OnFailureJobMode= (the older of the pair)
# was added, not OnSuccessJobMode=, so it cannot be relied on to date
# OnSuccessJobMode='s own addition to the man page -- unverified, left
# unstated here. What's confirmed either way: absent from the man page at
# v252, present on main, implemented and defaulting to "fail" regardless.
# This is NOT overridden here.
#
# What "fail" mode actually does when two back-to-back OnSuccess= firings
# of this same oneshot publish unit overlap (e.g. a slow `gh` call still
# running when the bridge completes its next iteration ~3.5 minutes later),
# verified against src/core/transaction.c's transaction_is_destructive()
# and src/core/job.c's job_type_is_conflicting()/job_type_lookup_merge() in
# the v252 source: under JOB_FAIL, a transaction is only rejected as
# "destructive" when the queued job's type conflicts with the new job's
# type for the same unit. Two JOB_START jobs for the same unit never reach
# that check: job_type_lookup_merge() (src/core/job.c, ~line 380)
# short-circuits identical types before consulting job_merging_table --
# `if (a == b) return a;` -- and the table's own comment confirms this is
# by design ("We don't store the main diagonal, because A merged with A is
# simply A."). So JOB_START merged with JOB_START trivially returns
# JOB_START without a table lookup, and job_type_is_conflicting() (job.h),
# which is defined in terms of job_type_lookup_merge(), is false for the
# pair -- a second OnSuccess= firing while the publisher's start job is
# still running is not rejected, it is merged into (dropped as redundant
# against) the in-flight start job. Nothing fails and no error is logged.
# For a singleton publisher gated by a content digest, a skipped/merged
# publish under overlap is expected and correct, not a bug: the next
# firing ~3.5 minutes later re-reads current state and picks up whatever
# changed in the meantime.
OnSuccess=eeebot-techtree-publish.service
