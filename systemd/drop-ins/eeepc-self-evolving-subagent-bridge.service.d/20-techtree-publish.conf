[Unit]
# Fires the tech-tree publisher at the end of every completed bridge
# iteration (issue #27), event-driven off the loop rather than a wall-clock
# timer -- this sidesteps the NTP-drift stagnation trap documented for
# wall-clock timers elsewhere in this project.
#
# eeepc-self-evolving-subagent-bridge.service is Type=oneshot, so per
# systemd.unit(5) (verified against the systemd.unit man page: "OnSuccess="
# lists units "activated when this unit enters the 'inactive' state", and
# that transition only fires "out of an active or activating state" -- not
# out of "failed"), a Type=oneshot unit with the default RemainAfterExit=no
# goes straight from "activating" to "inactive" the moment its ExecStart
# exits 0. That transition IS the moment this particular iteration ended
# and the loop's pause began -- so OnSuccess= here fires once per
# successful iteration, not just once ever.
#
# This drop-in lives in THIS repo (eeebot-ops-dashboard), not in
# ozand/eeebot: the dashboard depends on the self-evolving loop, not the
# other way around, so the loop's own unit file should not need to know
# the dashboard exists. Layering the trigger in as a drop-in keeps that
# dependency direction intact.
#
# OnSuccess= starts eeebot-techtree-publish.service as its own,
# independently enqueued job (per the same man page section: "OnSuccess="
# specifies units to enqueue, distinct from a dependency like BindsTo=/
# PartOf= that would propagate a child unit's result back to its parent).
# A failure of the publish job therefore cannot fail, block, or restart the
# bridge -- the loop keeps running regardless of whether gh-pages publish
# succeeds.
OnSuccess=eeebot-techtree-publish.service
