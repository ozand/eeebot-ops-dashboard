[Unit]
# Fires the tech-tree publisher at the end of every completed bridge
# iteration (issue #27), event-driven off the loop rather than a wall-clock
# timer -- this sidesteps the NTP-drift stagnation trap documented for
# wall-clock timers elsewhere in this project. (This is true of THIS
# trigger only: the staleness floor inside techtree_autopublish.py's
# should_publish() still reads wall-clock time.time(), and a backward clock
# jump there is handled separately -- see the comment on should_publish.)
#
# Sources checked (issue #27 review, blocker B6): the man.archlinux.org
# mirror of systemd.unit(5) and systemd.service(5), rendered for systemd
# 261.2 (freedesktop.org's own copy of these pages 403'd for this fetch;
# the host runs systemd 252, but OnSuccess=/OnSuccessJobMode=/oneshot
# semantics quoted below are long-stable and unchanged across that range).
# Quoting only what those pages actually say -- an earlier version of this
# comment attributed the phrase "out of an active or activating state" to
# OnSuccess=, which is wrong: that phrase is real, but it describes
# FailureAction=/SuccessAction= (a different, unrelated directive this
# unit does not set), not OnSuccess=/OnFailure=.
#
# systemd.unit(5), verbatim: `OnSuccess=` is "A space-separated list of one
# or more units that are activated when this unit enters the 'inactive'
# state" (`OnFailure=` is the same but for the "failed" state instead).
#
# eeepc-self-evolving-subagent-bridge.service is Type=oneshot with the
# default RemainAfterExit=no. systemd.service(5), verbatim: "if this
# option is used without RemainAfterExit= the service will never enter
# 'active' unit state, but will directly transition from 'activating' to
# 'deactivating' or 'dead' ... after a service of this type ran (and which
# has RemainAfterExit= not set) it will not show up as started afterwards,
# but as dead." "dead" is the substate backing the unit-level "inactive"
# state that OnSuccess= watches for -- so each successful ExecStart exit
# drives exactly the transition OnSuccess= fires on, once per completed
# iteration, not just once ever.
#
# This drop-in lives in THIS repo (eeebot-ops-dashboard), not in
# ozand/eeebot: the dashboard depends on the self-evolving loop, not the
# other way around, so the loop's own unit file should not need to know
# the dashboard exists. Layering the trigger in as a drop-in keeps that
# dependency direction intact.
#
# OnSuccess= starts eeebot-techtree-publish.service as its own,
# independently enqueued job, not a strong dependency like BindsTo=/
# PartOf= that would propagate the child unit's result back to this one --
# so a failure of the publish job cannot fail, block, or restart the
# bridge; the loop keeps running regardless of whether gh-pages publish
# succeeds.
#
# Caveat (issue #27 review, blocker B6), confirmed in systemd.unit(5):
# `OnSuccessJobMode=` defaults to "fail" (`OnFailureJobMode=` defaults to
# "replace"), and this is NOT overridden here. Per systemctl(1)'s
# --job-mode= "fail" description, that mode refuses to enqueue a job that
# would reverse an already-pending job's direction for the target unit
# (e.g. a queued stop flipping to a start, or vice versa) for the target
# unit's weak dependencies. Whether/how that interacts with two
# back-to-back OnSuccess= firings of this same oneshot publish unit (e.g.
# a slow `gh` call still running when the bridge completes its next
# iteration ~3.5 minutes later) has NOT been independently verified against
# a live overlap on the host -- treat a skipped publish under rapid
# back-to-back triggers as a known open question, not a confirmed bug.
OnSuccess=eeebot-techtree-publish.service
